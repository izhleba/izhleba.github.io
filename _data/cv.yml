cv:
  name: Aleksei Pshenichnyi
  label: AI/ML Research Engineer · Generative Video · Technical R&D Lead
  email: izhleba@gmail.com
  location: Barcelona, Spain
  image: ""
  summary: Hands-on AI/ML engineer and technology entrepreneur with 15+ years of software engineering experience, specializing in generative video, audio-driven facial animation, and applied machine learning. Co-founder of Elai, an AI video generation startup acquired by Panopto in 2024. Experienced in end-to-end ML research and engineering, from neural model development and evaluation to production deployment and real-time inference optimization. Combines deep technical expertise with R&D leadership and a strong background in distributed systems and production software architecture. Authorized to work in the EU.

