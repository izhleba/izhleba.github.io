    Experience:
      - company: Panopto
        position: Head of AI Research
        start_date: 2024-11
        end_date: present
        summary: Joined through Panopto's acquisition of Elai (October 2024). Lead R&D of the avatar video generation technology and new generative AI features, spending about 70% of my time hands-on on models, experiments and code.
        highlights:
          - Developed and released a new generation of audio-driven facial animation models to production; platform users generated 300K+ avatar videos in 2024-2026.
          - Researched expressive facial motion, addressing the over-smoothed articulation typical of supervised audio-to-animation models through training data design and architecture changes; integrated the results into the production models.
          - Built and shipped to production an AI feature that generates animated visual content (charts) from text prompts or presentation slides, using LLMs to produce structured chart descriptions and multimodal models to interpret slides.
          - Lead an R&D team of 4-5 engineers, combining research planning and technical architecture with direct implementation.

      - company: Elai
        position: Co-Founder, Chief R&D Officer (Hands-on Principal Engineer)
        start_date: 2021-05
        end_date: 2024-12
        summary: Co-founded Elai, an AI video generation startup acquired by Panopto in October 2024.
        highlights:
          - Architected and contributed hands-on to production neural systems for audio-driven facial animation and realistic talking-head video generation, using transformer-based models and convolutional autoencoders in PyTorch.
          - Led a 4-5-person R&D team while personally developing ML components, running experiments and making technical architecture decisions.
          - Established model training, experiment tracking and evaluation workflows combining automated metrics with structured human assessments and preference testing.
          - Developed a streaming real-time avatar MVP (LLM, text-to-speech, animation, neural rendering) achieving 25+ FPS and about 2-3 seconds from the first audio chunk to the first generated frame; the performance optimizations were reused in the main product.
          - Optimized performance-critical components with CUDA, Cython, Numba and JIT compilation.

      - company: Eidolon
        position: Head of Analytics (part-time)
        start_date: 2021-01
        end_date: 2022-02
        summary: Designed and led development of an event analytics platform for mobile games.
        highlights:
          - Designed the data models, processing workflows and reporting tools that turn user activity events into insights on engagement, conversion and product performance.
          - Worked with game developers to apply the analytics in product decisions.

      - company: DataSpike
        position: Technical Lead (Co-Founder)
        start_date: 2019-10
        end_date: 2021-01
        summary: Co-founded an early-stage startup building NLP-driven solutions for AML and KYC processes in financial institutions; led its research and development (Scala, Python, NLP, SPARQL).

      - company: Quadcode (IQ Option)
        position: Software Development (Data Engineering) Team Lead
        start_date: 2017-05
        end_date: 2019-10
        summary: Architect and hands-on lead of the analytics and ML data platform behind the IQ Option fintech product.
        highlights:
          - Designed and built a distributed event analytics platform with reliable event delivery, deduplication and consistency verification; this platform and the later one at Eidolon sustained thousands of events per second (peaks of tens of thousands) on tens of TB of hot data.
          - Cut recurring analytical reports from tens of minutes to seconds with pre-aggregations, partitioning and query plan optimization.
          - Led ML systems built on the platform, including prediction of which new users become paying customers to optimize ad spend, fraud detection and trading news recommendations.
          - Built real-time analytics and ML infrastructure with Scala and Akka and data pipelines with Python, Scala and Postgres.

      - company: Ice Owl
        position: Software Developer (Backend & Game AI)
        start_date: 2010-10
        end_date: 2017-04
        summary: Developed server-side game logic, multiplayer features and AI for social and strategy games in Scala and Java.
        highlights:
          - Designed memory-efficient planning for autonomous agents in a multiplayer tactical strategy game, reducing precomputed data from an estimated tens of GB to about 100 MB per map and enabling around 1,000 AI agents across hundreds of concurrent sessions on a single server.

