    Experience:
      - company: Panopto
        position: Head of AI Research
        start_date: 2024-11
        end_date: present
        summary: Joined through the acquisition of Elai. Lead avatar video generation R&D and new generative AI features; about 70% hands-on.
        highlights:
          - Released a new generation of audio-driven facial animation models to production; users generated 300K+ avatar videos in 2024-2026.
          - Fixed over-smoothed articulation in audio-to-animation models through training data design and architecture changes, now in production.
          - Shipped a feature that generates animated charts from text prompts or slides, using LLMs for structured chart descriptions and multimodal models to read slides.
          - Lead an R&D team of 4-5 engineers.

      - company: Elai
        position: Co-Founder, Chief R&D Officer (Hands-on Principal Engineer)
        start_date: 2021-05
        end_date: 2024-12
        summary: AI video generation startup, acquired by Panopto in October 2024.
        highlights:
          - Built production neural systems for audio-driven facial animation and talking-head video generation with transformer-based models and convolutional autoencoders in PyTorch.
          - Led a 4-5-person R&D team while developing models and running experiments myself.
          - Set up training, experiment tracking and evaluation combining automated metrics with structured human assessments and preference tests.
          - Built a streaming real-time avatar MVP (LLM, TTS, animation, neural rendering) at 25+ FPS, with 2-3 seconds from first audio chunk to first frame.
          - Optimized critical paths with CUDA, Cython, Numba and JIT compilation.

      - company: Eidolon
        position: Head of Analytics
        start_date: 2021-01
        end_date: 2022-02
        summary: Designed and led development of an event analytics platform for mobile games, covering data models, processing and reporting.

      - company: DataSpike
        position: Technical Lead (Co-Founder)
        start_date: 2019-10
        end_date: 2021-01
        summary: Led R&D of an early-stage NLP product for AML and KYC in financial institutions (Scala, Python, SPARQL).

      - company: Quadcode (IQ Option)
        position: Software Development (Data Engineering) Team Lead
        start_date: 2017-05
        end_date: 2019-10
        summary: Architect and hands-on lead of the analytics and ML data platform for the IQ Option fintech product.
        highlights:
          - Built a distributed event analytics platform with reliable delivery, deduplication and consistency checks; this platform and the later one at Eidolon handled thousands of events per second (peaks of tens of thousands) on tens of TB of hot data.
          - Cut recurring reports from tens of minutes to seconds with pre-aggregation, partitioning and query plan optimization.
          - Led ML systems on the platform, covering paying-user prediction for ad spend, fraud detection and trading news recommendations.
          - Built real-time analytics infrastructure with Scala and Akka and pipelines with Python, Scala and Postgres.

      - company: Ice Owl
        position: Software Developer (Backend & Game AI)
        start_date: 2010-10
        end_date: 2017-04
        summary: Backend and AI for multiplayer social and strategy games in Scala and Java.
        highlights:
          - Developed server-side game logic and game network protocols.
          - Designed memory-efficient planning for game AI agents, using about 100 MB of precomputed data per map instead of tens of GB and running around 1,000 agents on one server.

