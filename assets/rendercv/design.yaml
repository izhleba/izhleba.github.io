# for more options, see https://docs.rendercv.com/user_guide/yaml_input_structure/design/
design:
  theme: classic
  page:
    size: a4
    top_margin: 0.55in
    bottom_margin: 0.55in
    left_margin: 0.6in
    right_margin: 0.6in
    show_footer: false
    show_top_note: false
  header:
    space_below_name: 0.4cm
    space_below_headline: 0.4cm
    space_below_connections: 0.4cm
  entries:
    allow_page_break: true
  sections:
    space_between_regular_entries: 0.9em
    show_time_spans_in: []
