name: Render a CV
on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "bin/cv_for_rendercv.py"
      - "assets/rendercv/design.yaml"
      - "assets/rendercv/locale.yaml"
      - "assets/rendercv/settings.yaml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      - name: RenderCV
        run: |
          # The site CV schema (label/summary) differs from RenderCV 2.x, so convert first.
          python bin/cv_for_rendercv.py --source _data/cv.yml --output _data/.cv_rendercv.yml
          rendercv render _data/.cv_rendercv.yml --settings assets/rendercv/settings.yaml
          rm -f assets/rendercv/rendercv_output/*.typ _data/.cv_rendercv.yml
      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: RenderCV Output
          path: assets/rendercv/rendercv_output
      - name: Push the changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "chore: render the latest CV"
          git push
